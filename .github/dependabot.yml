# Updates proposed every week: npm dependencies (grouped) and GitHub Actions (pinned by SHA,
# Dependabot updates the hash and the version comment together).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      npm:
        patterns: ["*"]
    ignore:
      # @astrojs/check only accepts TypeScript 5 or 6: wait for it to support 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
